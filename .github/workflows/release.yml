name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches VERSION
        run: |
          bash scripts/version.sh check
          test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)" \
            || { echo "tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }
      - name: Create the release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/version.sh notes > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
